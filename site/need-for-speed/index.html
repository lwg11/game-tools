<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<title>霓虹海岸 · 竞速原型（M1）</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="app"></div>

<!-- HUD：速度 / 氮气 / 圈速 / 漂移分 -->
<div id="nfs-hud" class="nfs-hud hidden">
  <div class="nfs-tl">
    <div id="nfs-speed" class="nfs-speed">0</div>
    <div class="nfs-unit">km/h</div>
    <div class="nfs-nitro"><div id="nfs-nitro-fill"></div><span id="nfs-nitro-pct">100%</span></div>
  </div>
  <div class="nfs-tr">
    <div id="nfs-car-label">Street · 均衡好开</div>
    <div id="nfs-lap">圈 1</div>
    <div id="nfs-time">0:00.00</div>
    <div id="nfs-best">最佳 --</div>
  </div>
  <div class="nfs-br">
    <div id="nfs-drift">漂移 0</div>
  </div>
  <div id="nfs-msg">WASD 驾驶 / Space 漂移 / Shift 氮气</div>
<canvas id="nfs-map" width="150" height="150"></canvas>
</div>

<!-- 比赛 HUD / 结算 -->
<div id="nfs-racehud" class="hidden">
  <div id="nfs-race-pos">P1</div>
  <div id="nfs-race-meta"><span id="nfs-race-lap">1/3</span> · <span id="nfs-race-time">0:00</span></div>
  <div id="nfs-race-extra"></div>
</div>
<div id="nfs-results" class="hidden">
  <div class="nfs-res-panel">
    <h2 id="nfs-res-title">比赛结束</h2>
    <div id="nfs-res-lines"></div>
    <div class="nfs-res-btns">
      <button id="nfs-res-again" type="button">再来一局</button>
      <button id="nfs-res-roam" type="button">继续漫游</button>
      <button id="nfs-res-menu" type="button">返回菜单</button>
    </div>
  </div>
</div>
<button id="nfs-cheat-fab" type="button" class="hidden">金</button>
<div id="nfs-cheat-panel" class="hidden"></div>

<!-- 开始菜单 -->
<div id="nfs-menu" class="nfs-menu">
  <button id="nfs-mute" type="button" title="声音开（M）">🔊</button>
  <div class="nfs-panel">
    <h1>霓虹海岸</h1>
    <p>竞速 · 漂移 · 氮气 · 海滨城市</p>
    <div class="nfs-select">
      <div class="nfs-label">选择赛车</div>
      <div class="nfs-garage">
        <canvas id="nfs-car-preview"></canvas>
        <div class="nfs-stats" id="nfs-car-stats"></div>
      </div>
      <div class="nfs-pills" id="nfs-car-list"></div>
      <div class="nfs-label">外观涂装</div>
      <div class="nfs-pills" id="nfs-paint-list"></div>
      <div class="nfs-label">性能升级</div>
      <div id="nfs-upgrades"></div>
      <div class="nfs-label">金手指 · 疯狂模式</div>
      <div id="nfs-cheats"></div>
      <div class="nfs-label">比赛模式</div>
      <div class="nfs-pills" id="nfs-mode-list"></div>
      <div class="nfs-label">对手难度</div>
      <div class="nfs-pills" id="nfs-diff-list"></div>
      <div class="nfs-label">时间</div>
      <div class="nfs-pills" id="nfs-tod-list"></div>
      <div class="nfs-coins"><span class="nfs-coin-ico">●</span> 金币 <b id="nfs-coins">0</b></div>
    </div>
    <button id="nfs-btn-start">点火出发</button>
    <p class="nfs-keys" id="nfs-keys-pc">W/S 油门刹车 · A/D 转向 · Space 手刹漂移 · Shift 氮气</p>
    <p class="nfs-keys" id="nfs-keys-touch" style="display:none">← → 转向 · 右侧油门 / 刹车 / 漂移 / 氮气</p>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
