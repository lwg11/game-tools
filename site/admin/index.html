<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <title>后台管理 · 石器游戏厅</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="./admin.css">
</head>
<body class="admin-body">
  <header class="admin-top">
    <div class="admin-brand"><span class="admin-logo">⚙</span>石器游戏厅 · 后台管理</div>
    <div class="admin-top-right">
      <span id="adminUser" class="admin-user"></span>
      <a class="btn ghost small" href="../">返回游戏厅</a>
      <button id="adminLogout" class="btn ghost small">退出登录</button>
    </div>
  </header>

  <main class="admin-main">
    <!-- 登录 -->
    <section id="loginPanel" class="admin-card login-card hidden">
      <h2>管理员登录</h2>
      <p class="tip">使用用户名或手机号登录。固定管理员手机号 15755782911 注册并绑定后自动拥有管理权限。</p>
      <form id="loginForm">
        <label for="loginId">用户名 / 手机号</label>
        <input id="loginId" class="input" maxlength="20" autocomplete="username" placeholder="输入用户名或 11 位手机号" required>
        <label for="loginPw">密码</label>
        <input id="loginPw" class="input" type="password" maxlength="72" autocomplete="current-password" placeholder="登录密码" required>
        <div class="form-error" id="loginError"></div>
        <button class="btn primary block" type="submit" id="loginSubmit">登录</button>
      </form>
    </section>

    <!-- 无权限 -->
    <section id="forbidden" class="admin-card hidden">
      <h2>没有管理权限</h2>
      <p class="tip">当前账号不是管理员。如需开通，请联系固定管理员在「账号管理」中设置。</p>
    </section>

    <!-- 主面板 -->
    <section id="appPanel" class="hidden">
      <div class="stat-grid">
        <div class="stat"><b id="statTotal">0</b><span>总账号</span></div>
        <div class="stat"><b id="statAdmin">0</b><span>管理员</span></div>
        <div class="stat"><b id="statWeek">0</b><span>7 日新增</span></div>
        <div class="stat"><b id="statActiveWeek">0</b><span>7 日活跃</span></div>
        <div class="stat"><b id="statPlays">0</b><span>总场次</span></div>
      </div>

      <div class="admin-tabs">
        <button class="atab active" data-tab="accounts">账号管理</button>
        <button class="atab" data-tab="config">首页游戏配置</button>
        <button class="atab" data-tab="games">游戏场次</button>
      </div>

      <div id="tabAccounts" class="tab-panel">
        <div class="rows-head">
          <span>账号</span><span>角色</span><span>注册 / 最近登录 IP（归属地）</span><span>活跃度</span><span>各游戏场次与进度</span>
        </div>
        <div id="userRows"></div>
      </div>

      <div id="tabConfig" class="tab-panel hidden">
        <p class="tip">勾选要在游戏厅首页展示的游戏；未勾选的游戏不会出现在首页（游戏本身仍可通过链接访问）。</p>
        <div id="gameConfigList" class="check-grid"></div>
        <div class="config-bar">
          <button id="saveConfig" class="btn primary">保存配置</button>
          <span id="configMsg" class="msg"></span>
        </div>
      </div>

      <div id="tabGames" class="tab-panel hidden">
        <div id="gameStats" class="game-stats"></div>
        <p class="tip">场次按「进入一次游戏」统计（同一会话内重复进入不重复计数）。</p>
      </div>
    </section>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
